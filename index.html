<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CERENE Video Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .container {
      max-width: 1000px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #6b7280;
      font-size: 17px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: white;
      font-size: 15px;
    }

    .generate {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .generate:hover {
      background: #1f2937;
    }

    .status {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      color: #4b5563;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #f9fafb;
      border-radius: 15px;
      text-align: center;
    }

    .result h2 {
      margin-top: 0;
    }

    @media (max-width: 700px) {
      .header {
        padding: 18px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .container {
        margin-top: 30px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">🎬 CERENE Video Studio</div>
    <div class="badge">IA • Création vidéo</div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>Crée ton court-métrage</h1>
      <p>Décris ton histoire et prépare une vidéo animée avec l'intelligence artificielle.</p>
    </section>

    <section class="card">

      <label for="prompt">Décris ta vidéo</label>

      <textarea
        id="prompt"
        placeholder="Exemple : Warren joue au football dans la cour du collège. Il remarque qu'un camarade est seul et décide de venir lui parler..."
      ></textarea>

      <div class="options">

        <div>
          <label for="style">Style</label>
          <select id="style">
            <option>Animation 3D</option>
            <option>Dessin animé</option>
            <option>Anime</option>
            <option>Film cinématographique</option>
          </select>
        </div>

        <div>
          <label for="duration">Durée</label>
          <select id="duration">
            <option>5 secondes</option>
            <option>10 secondes</option>
            <option>15 secondes</option>
            <option>30 secondes</option>
          </select>
        </div>

      </div>

      <button class="generate" onclick="prepareVideo()">
        🎬 Préparer la vidéo
      </button>

      <div class="status" id="status">
        ✨ Préparation de votre projet vidéo...
      </div>

      <div class="result" id="result">
        <h2>🎥 Votre projet est prêt</h2>
        <p id="resultText"></p>
      </div>

    </section>

  </main>

  <script>

    function prepareVideo() {

      const prompt = document.getElementById("prompt").value.trim();
      const style = document.getElementById("style").value;
      const duration = document.getElementById("duration").value;

      if (!prompt) {
        alert("Décris d'abord la vidéo que tu veux créer.");
        return;
      }

      const status = document.getElementById("status");
      const result = document.getElementById("result");
      const resultText = document.getElementById("resultText");

      status.style.display = "block";
      result.style.display = "none";

      setTimeout(() => {

        status.style.display = "none";
        result.style.display = "block";

        resultText.textContent =
          "Style : " + style +
          " • Durée : " + duration +
          " • Description enregistrée avec succès.";

      }, 1200);
    }

  </script>

</body>
</html>
